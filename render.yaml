services:
  - type: web
    name: portfolio-backend
    runtime: node
    rootDir: portfolio/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: seble
      - key: ADMIN_PASSWORD
        generateValue: true
